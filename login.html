<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ChromaIQ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            500: '#14b8a6',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white bg-gray-50 dark:bg-[#0a0a0b] h-screen overflow-hidden">

    <!-- LOGIN STATE -->
    <div id="login-view" class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-[#0a0a0b] transition-opacity duration-500 overflow-y-auto p-4">
        <!-- Theme Toggle -->
        <button type="button" class="theme-toggle absolute top-6 right-6 p-2 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
            <i class="ph-bold ph-moon text-xl dark:hidden"></i>
            <i class="ph-bold ph-sun text-xl hidden dark:block"></i>
        </button>

        <div class="w-full max-w-md">
            <div class="card p-8 shadow-xl">
                <div class="text-center mb-8">
                    <a href="index.html" class="inline-flex items-center gap-3 mb-6 group">
                        <div class="w-10 h-10 rounded bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-2xl shadow-lg">
                            <i class="ph ph-aperture"></i>
                        </div>
                        <span class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">ChromaIQ</span>
                    </a>
                    <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Welcome back!</h1>
                    <p class="text-gray-500 mt-2">Sign in to your workspace</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email address</label>
                        <input type="email" value="admin@studio.com" required class="w-full px-4 py-2 bg-gray-50 dark:bg-[#121214] border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                        <div class="relative mb-2">
                            <input type="password" id="password" value="password123" required class="w-full px-4 py-2 pr-10 bg-gray-50 dark:bg-[#121214] border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors">
                            <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none transition-colors">
                                <i class="ph-bold ph-eye text-lg" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center shrink-0">
                            <input id="remember-me" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded shrink-0">
                            <label for="remember-me" class="ml-2 block text-xs sm:text-sm text-gray-700 dark:text-gray-300 whitespace-nowrap">Remember me</label>
                        </div>
                        <a href="#" class="text-xs sm:text-sm text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 whitespace-nowrap shrink-0">Forgot password?</a>
                    </div>

                    <button type="submit" class="w-full btn-primary py-2.5 rounded-lg font-medium flex justify-center items-center gap-2">
                        Sign In
                        <span class="bg-white/20 dark:bg-black/10 text-white dark:text-gray-900 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 uppercase tracking-wide">
                            <i class="ph-bold ph-shield-check"></i> Secure
                        </span>
                    </button>

                    <div class="relative my-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300 dark:border-gray-700"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white dark:bg-[#121214] text-gray-500">Or continue with</span>
                        </div>
                    </div>

                    <button type="button" class="w-full group bg-white dark:bg-[#121214] border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 py-2.5 rounded-lg font-medium flex justify-center items-center gap-2 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
                        <i class="ph-fill ph-google-logo text-xl group-hover:scale-110 group-hover:text-indigo-500 transition-transform duration-300"></i> Google SSO
                    </button>
                </form>
            </div>
            

        </div>
    </div>

    <!-- DASHBOARD WORKSPACE (Initially hidden) -->
    <div id="dashboard-view" class="hidden"></div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme setup
            const themeToggles = document.querySelectorAll('.theme-toggle');
            const setTheme = (isDark) => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
                if (typeof initCharts !== 'undefined') {
                    initCharts(); // Refresh charts on theme change
                }
            };

            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                setTheme(true);
            }

            themeToggles.forEach(toggle => {
                toggle.addEventListener('click', () => {
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            });

            // Login Logic
            const loginForm = document.getElementById('login-form');
            const loginView = document.getElementById('login-view');
            const dashboardView = document.getElementById('dashboard-view');
            
            // Password Toggle
            const togglePasswordBtn = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (togglePasswordBtn && passwordInput && eyeIcon) {
                togglePasswordBtn.addEventListener('click', () => {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        eyeIcon.classList.replace('ph-eye', 'ph-eye-slash');
                    } else {
                        passwordInput.type = 'password';
                        eyeIcon.classList.replace('ph-eye-slash', 'ph-eye');
                    }
                });
            }

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                // Simulate authentication delay
                const btn = loginForm.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Authenticating...';
                
                setTimeout(() => {
                    loginView.classList.add('opacity-0');
                    setTimeout(() => {
                        loginView.classList.add('hidden');
                        dashboardView.classList.remove('hidden');
                        
                        // Initialize charts after dashboard is visible
                        setTimeout(initCharts, 100);
                        
                        // Trigger fade animations
                        const fadeElements = dashboardView.querySelectorAll('.fade-up');
                        fadeElements.forEach(el => el.classList.add('visible'));
                    }, 500);
                }, 800);
            });

            // Logout Logic
            document.getElementById('logout-btn').addEventListener('click', () => {
                window.location.href = 'index.html';
            });

            // Mobile Sidebar Logic
            const sidebar = document.getElementById('sidebar');
            const openSidebarBtn = document.getElementById('open-sidebar');
            const closeSidebarBtn = document.getElementById('close-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const sidebarLinks = sidebar.querySelectorAll('a');

            const toggleSidebar = () => {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            };

            openSidebarBtn.addEventListener('click', toggleSidebar);
            closeSidebarBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
            
            sidebarLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth < 768) {
                        toggleSidebar();
                    }
                });
            });

            // Charts
            let barChartInstance = null;
            let donutChartInstance = null;

            const initCharts = () => {
                const isDark = document.documentElement.classList.contains('dark');
                const textColor = isDark ? '#9ca3af' : '#6b7280';
                const gridColor = isDark ? '#27272a' : '#e5e7eb';

                const barCtx = document.getElementById('dashBarChart');
                const donutCtx = document.getElementById('dashDonutChart');

                if (!barCtx || !donutCtx || barCtx.offsetParent === null) return;

                if (barChartInstance) barChartInstance.destroy();
                if (donutChartInstance) donutChartInstance.destroy();

                barChartInstance = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{
                            label: 'Delivered Assets',
                            data: [12, 19, 15, 25, 22, 10, 8],
                            backgroundColor: '#6366f1',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor } },
                            x: { grid: { display: false }, ticks: { color: textColor } }
                        }
                    }
                });

                donutChartInstance = new Chart(donutCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Completed', 'In Progress', 'Blocked'],
                        datasets: [{
                            data: [78, 15, 7],
                            backgroundColor: ['#10b981', '#6366f1', '#ef4444'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '80%',
                        plugins: { legend: { display: false } }
                    }
                });
            };
        });
    </script>
</body>
</html>
